services:
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:latest
    container_name: aspire-dashboard
    ports:
      - "18888:18888" # Dashboard UI (http://localhost:18888)
      - "4317:18889"  # OTLP Ingestion Endpoint
    environment:
      - DOTNET_DASHBOARD_UNSECURED_ALLOW_ANONYMOUS=true
    restart: unless-stopped
  
  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: azurite_storage
    ports:
      - "10000:10000" # Puerto exclusivo para Blob Storage
    volumes:
      - azurite_data:/data
    command: "azurite-blob --blobHost 0.0.0.0 --blobPort 10000 --location /data --skipApiVersionCheck"

volumes:
  azurite_data: