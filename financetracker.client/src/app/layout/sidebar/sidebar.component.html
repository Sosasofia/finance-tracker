<div class="sidebar-wrapper">
  <div class="sidebar-header" routerLink="/settings" style="cursor: pointer">
    @if (userPicture) {
      <div
        class="sidebar-avatar sidebar-avatar-image"
        role="img"
        aria-label="Profile avatar"
        [style.background-image]="'url(' + userPicture + ')'"
      ></div>
    } @else {
      <div class="sidebar-avatar sidebar-avatar-fallback" aria-hidden="true">
        {{ userName.charAt(0).toUpperCase() || 'F' }}
      </div>
    }

    <div class="sidebar-user-info">
      <span class="sidebar-greeting">Hello, {{ userName }}!</span>
      @if (userEmail) {
        <span class="sidebar-email" [attr.title]="userEmail">{{ userEmail }}</span>
      }
      <span class="sidebar-profile-link">
        View profile
        <mat-icon aria-hidden="true">arrow_forward</mat-icon>
      </span>
    </div>
  </div>

  <div class="nav-menu">
    @for (item of navItems; track item.path) {
      @if (!item.mobileOnly) {
        <button
          mat-button
          class="menu-item"
          [routerLink]="item.path"
          routerLinkActive="active-link"
        >
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </button>
      }
    }

    <div class="bottom-nav">
      <button mat-button class="menu-item logout" (click)="onLogout()">
        <mat-icon>logout</mat-icon>

        <span>Logout</span>
      </button>
    </div>
  </div>
</div>
