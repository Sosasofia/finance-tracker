<div class="sidebar-wrapper">
  <div class="sidebar-header" routerLink="/settings" style="cursor: pointer">
    <img src="{{ 'avatar.png' }}" alt="Avatar" class="sidebar-avatar" />

    <div class="sidebar-user-info">
      <span class="sidebar-greeting">Hello, {{ userName }}!</span>
    </div>
  </div>

  <div class="nav-menu">
    @for (item of navItems; track item.path) {
      @if (!item.mobileOnly) {
        <button
          mat-button
          class="menu-item"
          [routerLink]="item.path"
          routerLinkActive="active-link"
        >
          <mat-icon>{{ item.icon }}</mat-icon>
          <span>{{ item.label }}</span>
        </button>
      }
    }

    <div class="bottom-nav">
      <button mat-button class="menu-item logout" (click)="onLogout()">
        <mat-icon>logout</mat-icon>

        <span>Logout</span>
      </button>
    </div>
  </div>
</div>
