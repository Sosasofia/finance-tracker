name: CI - Validation & Build

on:
  push:
    branches:
      - main
      - dev
  pull_request:
    branches:
      - main

jobs:
  backend-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.x"
          cache: true
          cache-dependency-path: ./FinanceTracker.sln

      - name: Check Formatting
        run: dotnet format ./FinanceTracker.sln --verify-no-changes --verbosity normal

      - name: Build
        run: dotnet build ./FinanceTracker.sln --configuration Release

      - name: Test
        run: dotnet test FinanceTracker.Test/FinanceTracker.Test.csproj --no-build --configuration Release
        
  frontend-validation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: financetracker.client/package-lock.json
          
      - name: Install Dependencies
        working-directory: ./financetracker.client
        run: npm ci

      - name: Lint
        working-directory: ./financetracker.client
        run: npm run lint

      - name: Test
        working-directory: ./financetracker.client
        run: npm run test -- --watch=false --browsers=ChromeHeadless
